[workspace]
resolver = "3"
members = ["app", "render", "scene"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
wgpu = "30"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.36"
egui-wgpu = "0.36"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
